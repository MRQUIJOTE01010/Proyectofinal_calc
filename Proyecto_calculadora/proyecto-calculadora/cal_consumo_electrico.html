<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Consumo Eléctrico</title>
 
    <link rel="stylesheet" href="./src/consumo.css">

</head>

<body>
    <div class="contenedor">

        <h1>
            Calculadora de Consumo Eléctrico
        </h1>

        <p class="descripcion">
            Calcula el consumo y costo mensual de un electrodoméstico.
        </p>

        <div class="formulario">

            <label>
                Nombre del equipo
            </label>

            <input
                type="text"
                id="equipo"
                placeholder="Aire acondicionado">

            <label>
                Potencia (Watts)
            </label>

            <input
                type="number"
                id="potencia"
                placeholder=" 1200">

            <label>
                Horas de uso por día
            </label>

            <input
                type="number"
                id="horas"
                placeholder=" 8">

            <label>
                Días de uso al mes
            </label>

            <input
                type="number"
                id="dias"
                placeholder="30">

            <label>
                Precio del kWh
            </label>

            <input
                type="number"
                id="precio"
                placeholder="11">

        </div>

        <div class="botones">

            <button id="calcular">
                Calcular
            </button>

            <button id="limpiar">
                Limpiar
            </button>

        </div>

        <div class="resultado">
            <h2>Resultado</h2>

            <p id="consumoDiario">
                Consumo diario: 
            </p>

            <p id="consumoMensual">
                Consumo mensual: 
            </p>

            <p id="costoMensual">
                Costo mensual: 

            </p>

            <p id="nivel">
                Nivel de consumo: 

            </p>
            <p id="consejo">
                Consejo: 

            </p>
            <p id="fecha">
                Fecha: 
            </p>

        </div>

        <div class="acciones">
            <button id="copiar">
                Copiar Resultado
            </button>

        </div>
    </div>

    <script src="./src/consumo.js"></script>

</body>

</html>
